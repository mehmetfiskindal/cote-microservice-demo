services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v3-api-gateway
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      COTE_DISCOVERY_REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - order-service
      - payment-service
      - inventory-service
      - notification-service
    command: npm run dev:api

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v3-order-service
    environment:
      NODE_ENV: development
      PORT: 3001
      ORDER_DATABASE_URL: postgresql://postgres:postgres@order-db:5432/order_db
      COTE_DISCOVERY_REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - order-db
    command: sh -c "npx prisma generate --schema apps/order-service/prisma/schema.prisma && until npx prisma db push --schema apps/order-service/prisma/schema.prisma; do sleep 2; done && npm run dev:order"

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v3-payment-service
    environment:
      NODE_ENV: development
      PORT: 3002
      PAYMENT_DATABASE_URL: postgresql://postgres:postgres@payment-db:5432/payment_db
      COTE_DISCOVERY_REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - payment-db
    command: sh -c "npx prisma generate --schema apps/payment-service/prisma/schema.prisma && until npx prisma db push --schema apps/payment-service/prisma/schema.prisma; do sleep 2; done && npm run dev:payment"

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v3-inventory-service
    environment:
      NODE_ENV: development
      PORT: 3003
      INVENTORY_DATABASE_URL: postgresql://postgres:postgres@inventory-db:5432/inventory_db
      COTE_DISCOVERY_REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - inventory-db
    command: sh -c "npx prisma generate --schema apps/inventory-service/prisma/schema.prisma && until npx prisma db push --schema apps/inventory-service/prisma/schema.prisma; do sleep 2; done && npm run dev:inventory"

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v3-notification-service
    environment:
      NODE_ENV: development
      PORT: 3004
      NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@notification-db:5432/notification_db
      COTE_DISCOVERY_REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - notification-db
    command: sh -c "npx prisma generate --schema apps/notification-service/prisma/schema.prisma && until npx prisma db push --schema apps/notification-service/prisma/schema.prisma; do sleep 2; done && npm run dev:notification"

  monitoring-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v3-monitoring-service
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      ORDER_DATABASE_URL: postgresql://postgres:postgres@order-db:5432/order_db
      COTE_DISCOVERY_REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - order-db
    command: sh -c "npx prisma generate --schema apps/monitoring-service/prisma/schema.prisma && until npx prisma db push --schema apps/monitoring-service/prisma/schema.prisma; do sleep 2; done && npm run dev:monitoring"

  monitoring-dashboard:
    build:
      context: ./apps/monitoring-dashboard
      dockerfile: Dockerfile
    container_name: v3-monitoring-dashboard
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://monitoring-service:4000/monitoring
    depends_on:
      - monitoring-service

  order-db:
    image: postgres:16-alpine
    container_name: v3-order-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    ports:
      - "5433:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data

  payment-db:
    image: postgres:16-alpine
    container_name: v3-payment-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_db
    ports:
      - "5434:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data

  inventory-db:
    image: postgres:16-alpine
    container_name: v3-inventory-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    ports:
      - "5435:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data

  notification-db:
    image: postgres:16-alpine
    container_name: v3-notification-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_db
    ports:
      - "5436:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: v3-redis
    ports:
      - "6379:6379"

volumes:
  order-db-data:
  payment-db-data:
  inventory-db-data:
  notification-db-data: